<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --ink:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --accent:#2dd4bf; --accent2:#14b8a6; --good:#22c55e; --bad:#f87171;
    --goodbg:#0c2a1a; --badbg:#2a1414; --chip:#0b3b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
  header{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  .bar{height:8px;background:var(--card);border-radius:999px;overflow:hidden;margin-top:6px}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
  .topic{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--accent);background:var(--chip);padding:3px 9px;border-radius:999px;margin-bottom:10px}
  .stem{font-size:17px;margin:2px 0 14px;white-space:pre-wrap}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent2)}
  .opt input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
  .opt.sel{border-color:var(--accent);background:#22323f}
  .opt.right{border-color:var(--good);background:var(--goodbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .opt .tag{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
  .opt .tag.r{color:var(--good)} .opt .tag.w{color:var(--bad)}
  .row{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
  .row .lab{flex:1 1 230px}
  select,input[type=text]{background:#0b1220;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:15px;max-width:100%}
  select:focus,input:focus{outline:2px solid var(--accent2)}
  select.right,input.right{border-color:var(--good)} select.wrong,input.wrong{border-color:var(--bad)}
  .grp{margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:10px}
  .grp h4{margin:0 0 8px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  .btn{appearance:none;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--accent2);color:#04201d}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent2)}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .fb{margin-top:14px;border-radius:12px;padding:14px;border:1px solid var(--line);display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--goodbg);border-color:#1f5135}
  .fb.no{background:var(--badbg);border-color:#5b2626}
  .fb .verdict{font-weight:700;font-size:15px;margin-bottom:6px}
  .fb .verdict.ok{color:var(--good)} .fb .verdict.no{color:var(--bad)}
  .fb p{margin:6px 0}
  .fb .lblrow{font-size:12px;color:var(--muted);margin-top:8px}
  .fb .strat{font-style:italic;color:#cbd5e1}
  .fb .fblabel{font-weight:700;font-size:12px;letter-spacing:.03em;color:var(--muted);
    text-transform:uppercase;margin:12px 0 2px}
  .fb ul.whynot{margin:2px 0 0;padding-left:20px}
  .fb ul.whynot li{margin:5px 0;line-height:1.5}
  #clock{font-variant-numeric:tabular-nums}
  #clock.warn{color:#f59e0b;font-weight:700}
  #clock.crit{color:var(--bad);font-weight:700}
  .modepick{display:flex;gap:8px;margin:10px 0 2px}
  .modepick button{flex:1;text-align:left}
  .modepick button.on{outline:2px solid var(--accent)}
  .navwrap{margin-top:12px}
  .navtoggle{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .navgrid{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .navgrid button{width:30px;height:26px;font-size:11px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:#111827;color:var(--muted);padding:0}
  .navgrid button.ok{background:var(--goodbg);border-color:#1f5135;color:var(--good)}
  .navgrid button.no{background:var(--badbg);border-color:#5b2626;color:var(--bad)}
  .navgrid button.flag{border-color:#f59e0b;color:#f59e0b}
  .navgrid button.cur{outline:2px solid var(--accent)}
  .flagbtn.on{color:#f59e0b;border-color:#f59e0b}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .end{text-align:center;padding:24px 8px}
  .score{font-size:46px;font-weight:800;color:var(--accent)}
  .endsub{color:var(--muted);margin-top:6px}
  table.brk{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}
  table.brk td{border-top:1px solid var(--line);padding:7px 6px;text-align:left}
  table.brk td:last-child{text-align:right;color:var(--muted)}
  .miss{text-align:left;margin-top:18px;font-size:13px;color:var(--muted)}
  .footnote{font-size:11px;color:var(--muted);margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>__HEADER__</h1>
    <div class="sub">__SUBTITLE__</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="pos">Question 1 of 50</span><span id="clock"></span><span id="sc">Score 0 / 0</span></div>
  </header>
  <div id="app"></div>
</div>
<script>
const Q = __QUESTIONS__;

// ---------- persistent history ----------
// Keyed by a hash of the stem, not array index, so history survives the
// reordering that balance_answers.py performs between builds.
function qid(q){
  const s=q.stem||''; let h=0;
  for(let k=0;k<s.length;k++){ h=(h*31+s.charCodeAt(k))|0; }
  return 'q'+(h>>>0).toString(36);
}
const STORE='nclexquiz:'+location.pathname.split('/').pop();
let HIST={};
try{ HIST=JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ HIST={}; }
function saveHist(){ try{ localStorage.setItem(STORE,JSON.stringify(HIST)); }catch(e){} }
function record(q,correct,conf){
  HIST[qid(q)]={c:correct,conf:conf,t:Date.now()};
  saveHist();
}
function seen(q){ return HIST[qid(q)]; }
function missedSet(){ return Q.filter(q=>{ const h=seen(q); return h && !h.c; }); }
function unseenSet(){ return Q.filter(q=>!seen(q)); }

// ---------- app logic ----------
const app=document.getElementById('app');
const fill=document.getElementById('fill');
const posEl=document.getElementById('pos');
const scEl=document.getElementById('sc');
const clockEl=document.getElementById('clock');
let ITEMS=Q.slice();               // the set being worked this session
let i=0, score=0, answeredCount=0;
let result=new Array(ITEMS.length).fill(null); // true/false once answered
let conf=new Array(ITEMS.length).fill(null);   // 'sure' | 'unsure'
let spent=new Array(ITEMS.length).fill(0);     // seconds on each item
let flags=new Array(ITEMS.length).fill(false); // flagged for review
let navOpen=false;

// UWorld's documented pattern: Tutor mode (rationale immediately, no clock)
// and Timed mode (clock runs, feedback deferred) are independent of each other.
// Timed mode here defers rationale entirely -- missed items are saved, so the
// review loop is "run Timed, then re-run Missed only in Tutor".
let TIMED=false;
const SECS_PER_ITEM=90;            // ~NCLEX pacing (5h / ~150 items ≈ 2 min)
let deadline=0, tick=null, itemStart=0, warned={};

function fmt(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0'); }

function stopClock(){ if(tick){ clearInterval(tick); tick=null; } }

function startClock(seconds){
  stopClock(); warned={};
  deadline=Date.now()+seconds*1000;
  const paint=()=>{
    const left=(deadline-Date.now())/1000;
    clockEl.textContent=fmt(left);
    clockEl.className = left<=30?'crit' : left<=120?'warn' : '';
    // Canvas New Quizzes' cadence: warn at 2 min and 30 s, then auto-submit.
    if(left<=120 && !warned.m2){ warned.m2=1; flash('2 minutes left'); }
    if(left<=30  && !warned.s30){ warned.s30=1; flash('30 seconds left'); }
    if(left<=0){ stopClock(); clockEl.textContent='0:00'; results(true); }
  };
  paint(); tick=setInterval(paint,1000);
}

function flash(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);'
    +'background:var(--badbg);border:1px solid #5b2626;color:#fff;padding:8px 14px;'
    +'border-radius:8px;font-size:13px;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.4)';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2600);
}

function setMeta(){
  posEl.textContent='Question '+(i+1)+' of '+ITEMS.length;
  scEl.textContent='Score '+score+' / '+answeredCount;
  fill.style.width=((answeredCount)/ITEMS.length*100)+'%';
}

function startSession(set){
  if(!set.length) return;
  ITEMS=set.slice();
  i=0; score=0; answeredCount=0;
  result=new Array(ITEMS.length).fill(null);
  conf=new Array(ITEMS.length).fill(null);
  spent=new Array(ITEMS.length).fill(0);
  flags=new Array(ITEMS.length).fill(false);
  if(TIMED) startClock(ITEMS.length*SECS_PER_ITEM);
  else { stopClock(); clockEl.textContent=''; clockEl.className=''; }
  render();
}

function startScreen(){
  const missed=missedSet(), unseen=unseenSet();
  const attempted=Q.length-unseen.length;
  const opt=(id,label,sub,n,disabled)=>
    '<button class="btn'+(disabled?' ghost':'')+'" id="'+id+'"'+(disabled?' disabled':'')+
    ' style="display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px">'
    +'<strong>'+label+'</strong> <span style="opacity:.75">— '+n+' item'+(n===1?'':'s')+'</span>'
    +'<div style="font-size:12px;opacity:.7;font-weight:400;margin-top:3px">'+sub+'</div></button>';
  const mins=Math.round(Q.length*SECS_PER_ITEM/60);
  app.innerHTML='<div class="card">'
    +'<div class="stem" style="margin-bottom:4px">Choose how to run this quiz</div>'
    +(attempted?'<div class="hint">You have answered '+attempted+' of '+Q.length
        +' items before. Missed: '+missed.length+'.</div>'
      :'<div class="hint">First run — no history yet.</div>')
    +'<div class="modepick">'
    +'<button class="btn ghost'+(TIMED?'':' on')+'" id="mode-tutor"><strong>Tutor</strong>'
      +'<div style="font-size:11px;opacity:.75;font-weight:400">Rationale after each answer. No clock.</div></button>'
    +'<button class="btn ghost'+(TIMED?' on':'')+'" id="mode-timed"><strong>Timed</strong>'
      +'<div style="font-size:11px;opacity:.75;font-weight:400">'+Math.round(SECS_PER_ITEM)+'s per item ('
      +mins+' min full). Rationale held to the end.</div></button>'
    +'</div>'
    +opt('m-full','Full quiz','Every item, in a fresh order.',Q.length,false)
    +opt('m-missed','Missed only','Re-drill just the items you got wrong last time.',missed.length,missed.length===0)
    +opt('m-unseen','Unseen only','Items you have not answered yet.',unseen.length,unseen.length===0)
    +(attempted?'<div style="text-align:center;margin-top:14px">'
        +'<button class="btn ghost" id="m-reset" style="font-size:12px">Clear history</button></div>':'')
    +'</div>';
  const go=(id,set)=>{ const b=document.getElementById(id); if(b&&!b.disabled) b.onclick=()=>startSession(set); };
  go('m-full',Q); go('m-missed',missed); go('m-unseen',unseen);
  document.getElementById('mode-tutor').onclick=()=>{ TIMED=false; startScreen(); };
  document.getElementById('mode-timed').onclick=()=>{ TIMED=true;  startScreen(); };
  const rb=document.getElementById('m-reset');
  if(rb) rb.onclick=()=>{ HIST={}; saveHist(); startScreen(); };
  stopClock();
  posEl.textContent=Q.length+' items'; scEl.textContent=''; clockEl.textContent=''; fill.style.width='0%';
}
function eqSet(a,b){ if(a.length!==b.length)return false; const s=new Set(a); return b.every(x=>s.has(x)); }

function render(){
  const q=ITEMS[i]; setMeta(); itemStart=Date.now();
  let body='';
  if(q.type==='radio'||q.type==='multi'){
    const inputType=q.type==='radio'?'radio':'checkbox';
    body='<div class="opts">'+q.opts.map((o,idx)=>
      '<label class="opt" data-idx="'+idx+'"><input type="'+inputType+'" name="o" value="'+idx+'">'
      +'<span>'+o+'</span></label>').join('')+'</div>';
    if(q.type==='multi') body='<div class="hint">Select all that apply. Judge each option independently.</div>'+body;
  } else if(q.type==='matrix'){
    body=q.rows.map((r,ri)=>'<div class="row"><span class="lab">'+r.t+'</span>'
      +'<select data-row="'+ri+'"><option value="">— choose —</option>'
      +q.cols.map((c,ci)=>'<option value="'+ci+'">'+c+'</option>').join('')+'</select></div>').join('');
  } else if(q.type==='match'){
    body=q.rows.map((r,ri)=>'<div class="row"><span class="lab">'+r.t+'</span>'
      +'<select data-row="'+ri+'"><option value="">— choose —</option>'
      +q.shared.map((c,ci)=>'<option value="'+ci+'">'+c+'</option>').join('')+'</select></div>').join('');
  } else if(q.type==='cloze'){
    body=q.blanks.map((b,bi)=>'<div class="row"><span class="lab">'+b.label+'</span>'
      +'<select data-row="'+bi+'"><option value="">— choose —</option>'
      +b.opts.map((c,ci)=>'<option value="'+ci+'">'+c+'</option>').join('')+'</select></div>').join('');
  } else if(q.type==='bowtie'){
    const grp=(title,key,opts,multi)=>'<div class="grp"><h4>'+title+'</h4>'
      +opts.map((o,idx)=>'<label class="opt" data-key="'+key+'" data-idx="'+idx+'">'
        +'<input type="'+(multi?'checkbox':'radio')+'" name="'+key+'" value="'+idx+'"><span>'+o+'</span></label>').join('')+'</div>';
    body=grp('Central problem (pick 1)','problem',q.problem.opts,false)
        +grp('Two actions to take (pick 2)','actions',q.actions.opts,true)
        +grp('Two parameters to monitor (pick 2)','params',q.params.opts,true);
  } else if(q.type==='calc'){
    body='<div class="row"><input type="text" id="calc" placeholder="e.g., 9 or 8.8" inputmode="decimal"> %</div>';
  }
  const last=i===ITEMS.length-1;
  app.innerHTML='<div class="card"><span class="topic">'+q.topic+'</span>'
    +'<div class="stem">'+(i+1)+'. '+q.stem+'</div>'+body
    +'<div class="hint" id="confhint">Commit your answer — say how sure you are.</div>'
    +'<div class="actions">'
    +'<button class="btn ghost" id="unsure">Not sure</button>'
    +'<button class="btn" id="sure">Confident</button>'
    +'<button class="btn ghost flagbtn'+(flags[i]?' on':'')+'" id="flag" title="Flag for review">'
      +(flags[i]?'⚑ Flagged':'⚐ Flag')+'</button>'
    +'<button class="btn ghost" id="next" disabled>'+(last?'See results':'Next ▸')+'</button>'
    +'</div><div class="fb" id="fb"></div>'
    +'<div class="navwrap"><span class="navtoggle" id="navtoggle">'
      +(navOpen?'▾':'▸')+' Question navigator ('+answeredCount+'/'+ITEMS.length+' answered'
      +(flags.filter(Boolean).length?', '+flags.filter(Boolean).length+' flagged':'')+')</span>'
    +(navOpen?'<div class="navgrid" id="navgrid">'+ITEMS.map((_,idx)=>{
        const cls=[]; if(result[idx]===true)cls.push('ok'); if(result[idx]===false)cls.push('no');
        if(flags[idx])cls.push('flag'); if(idx===i)cls.push('cur');
        return '<button data-go="'+idx+'" class="'+cls.join(' ')+'">'+(idx+1)+'</button>';
      }).join('')+'</div>':'')
    +'</div></div>';

  // selection highlighting for label-based inputs
  app.querySelectorAll('.opt input').forEach(inp=>inp.addEventListener('change',()=>{
    const grpName=inp.name;
    app.querySelectorAll('.opt input[name="'+grpName+'"]').forEach(x=>x.closest('.opt').classList.toggle('sel',x.checked));
  }));
  document.getElementById('unsure').onclick=()=>grade('unsure');
  document.getElementById('sure').onclick=()=>grade('sure');
  document.getElementById('next').onclick=()=>{ if(i<ITEMS.length-1){i++;render();} else {results();} };
  document.getElementById('flag').onclick=()=>{ flags[i]=!flags[i]; render(); };
  document.getElementById('navtoggle').onclick=()=>{ navOpen=!navOpen; render(); };
  const grid=document.getElementById('navgrid');
  if(grid) grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{ i=+b.dataset.go; render(); });

  // an already-answered item stays answered when you jump back to it
  if(result[i]!==null){
    document.getElementById('unsure').disabled=true;
    document.getElementById('sure').disabled=true;
    document.getElementById('next').disabled=false;
    const h=document.getElementById('confhint');
    if(h) h.textContent='Already answered — '+(result[i]?'correct':'missed')
      +(conf[i]?' ('+(conf[i]==='sure'?'confident':'not sure')+')':'');
  }
}

function grade(confidence){
  const q=ITEMS[i]; let correct=false; let answerText='';
  const submitBtn=document.getElementById('sure'); const nextBtn=document.getElementById('next');
  const unsureBtn=document.getElementById('unsure'); const hintEl=document.getElementById('confhint');
  if(unsureBtn) unsureBtn.disabled=true;
  if(hintEl) hintEl.remove();
  if(q.type==='radio'){
    const sel=app.querySelector('input[name="o"]:checked');
    const chosen=sel?+sel.value:-1; correct=chosen===q.ans;
    app.querySelectorAll('.opt').forEach((el,idx)=>{
      if(idx===q.ans){el.classList.add('right'); el.insertAdjacentHTML('beforeend','<span class="tag r">correct</span>');}
      if(idx===chosen&&chosen!==q.ans){el.classList.add('wrong'); el.insertAdjacentHTML('beforeend','<span class="tag w">your pick</span>');}
    });
    answerText='Correct answer: '+q.opts[q.ans];
  } else if(q.type==='multi'){
    const chosen=[...app.querySelectorAll('input[name="o"]:checked')].map(x=>+x.value);
    correct=eqSet(chosen,q.ans);
    app.querySelectorAll('.opt').forEach((el,idx)=>{
      const isAns=q.ans.includes(idx), picked=chosen.includes(idx);
      if(isAns){el.classList.add('right'); el.insertAdjacentHTML('beforeend','<span class="tag r">answer</span>');}
      if(picked&&!isAns){el.classList.add('wrong'); el.insertAdjacentHTML('beforeend','<span class="tag w">your pick</span>');}
    });
    answerText='Correct selections: '+q.ans.map(x=>q.opts[x]).join(' · ');
  } else if(q.type==='matrix'||q.type==='match'||q.type==='cloze'){
    const rows=q.type==='cloze'?q.blanks:q.rows;
    let allRight=true;
    app.querySelectorAll('select[data-row]').forEach(sel=>{
      const ri=+sel.dataset.row; const a=rows[ri].a; const v=sel.value===''?-1:+sel.value;
      if(v===a){sel.classList.add('right');} else {sel.classList.add('wrong'); allRight=false;}
      sel.disabled=true;
    });
    correct=allRight;
    if(q.type==='cloze'){answerText='Answers: '+q.blanks.map(b=>b.opts[b.a]).join(' · ');}
    else if(q.type==='match'){answerText='Answers: '+q.rows.map(r=>r.t+' → '+q.shared[r.a]).join(' · ');}
    else {answerText='Answers: '+q.rows.map(r=>r.t+' → '+q.cols[r.a]).join(' · ');}
  } else if(q.type==='bowtie'){
    const pSel=app.querySelector('input[name="problem"]:checked');
    const pOk=pSel&&+pSel.value===q.problem.a;
    const aChosen=[...app.querySelectorAll('input[name="actions"]:checked')].map(x=>+x.value);
    const mChosen=[...app.querySelectorAll('input[name="params"]:checked')].map(x=>+x.value);
    const aOk=eqSet(aChosen,q.actions.ans), mOk=eqSet(mChosen,q.params.ans);
    correct=pOk&&aOk&&mOk;
    const mark=(key,ansArr,single)=>{
      app.querySelectorAll('.opt[data-key="'+key+'"]').forEach(el=>{
        const idx=+el.dataset.idx; const picked=el.querySelector('input').checked;
        const isAns=single?(idx===ansArr):ansArr.includes(idx);
        if(isAns){el.classList.add('right');}
        if(picked&&!isAns){el.classList.add('wrong');}
      });
    };
    mark('problem',q.problem.a,true); mark('actions',q.actions.ans,false); mark('params',q.params.ans,false);
    answerText='Problem: '+q.problem.opts[q.problem.a]
      +' | Actions: '+q.actions.ans.map(x=>q.actions.opts[x]).join(', ')
      +' | Monitor: '+q.params.ans.map(x=>q.params.opts[x]).join(', ');
  } else if(q.type==='calc'){
    const inp=document.getElementById('calc'); const v=parseFloat((inp.value||'').replace('%','').trim());
    correct=!isNaN(v)&&v>=q.acceptLo&&v<=q.acceptHi;
    inp.classList.add(correct?'right':'wrong'); inp.disabled=true;
    answerText='Correct answer: '+q.answer;
  }

  // lock inputs
  app.querySelectorAll('input').forEach(x=>x.disabled=true);
  submitBtn.disabled=true; nextBtn.disabled=false;

  if(result[i]===null){
    result[i]=correct; conf[i]=confidence; answeredCount++; if(correct)score++;
    spent[i]=Math.round((Date.now()-itemStart)/1000);
    record(q,correct,confidence);
  }
  setMeta();

  // Timed mode withholds the rationale — the review loop is to re-run
  // "Missed only" in Tutor mode afterwards, which is why history matters.
  if(TIMED){
    if(i<ITEMS.length-1){ i++; render(); } else { results(); }
    return;
  }

  const fb=document.getElementById('fb');
  fb.className='fb show '+(correct?'ok':'no');
  // Structured feedback when the item provides it, else the legacy single blob.
  // Research (van der Kleij 2015; Ryan 2020) favours explaining each distractor
  // separately; Mayer's segmenting principle says the blocks must be visually
  // distinct rather than semicolon-chained into one paragraph.
  let body;
  if(q.why || (q.whyNot && q.whyNot.length)){
    body = (q.why ? '<div class="fblabel">Why this is correct</div><p>'+q.why+'</p>' : '')
      + (q.whyNot && q.whyNot.length
          ? '<div class="fblabel">Why the others are wrong</div><ul class="whynot">'
            + q.whyNot.map(w=>'<li>'+w+'</li>').join('') + '</ul>'
          : '');
  } else {
    body = '<p>'+q.rat+'</p>';
  }
  fb.innerHTML='<div class="verdict '+(correct?'ok':'no')+'">'+(correct?'✓ Correct':'✗ Not quite')+'</div>'
    +'<p>'+answerText+'</p>'
    + body
    + (q.strat ? '<div class="fblabel">Key concept</div><p class="strat">'+q.strat+'</p>' : '')
    +'<div class="lblrow">Client Needs: '+q.cat+' · Cognitive level: '+q.lvl+'</div>';
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function results(ranOut){
  stopClock();
  const pct=Math.round(score/ITEMS.length*100);
  const totalSecs=spent.reduce((a,b)=>a+b,0);
  const answered=spent.filter((s,idx)=>result[idx]!==null);
  const slowest=ITEMS.map((q,idx)=>({q,idx,s:spent[idx]}))
    .filter(x=>result[x.idx]!==null).sort((a,b)=>b.s-a.s).slice(0,3);
  const cats={};
  ITEMS.forEach((q,idx)=>{ if(!cats[q.cat])cats[q.cat]={c:0,t:0}; cats[q.cat].t++; if(result[idx])cats[q.cat].c++; });
  const rows=Object.entries(cats).sort((a,b)=>b[1].t-a[1].t)
    .map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.c+' / '+v.t+'</td></tr>').join('');

  // Confidence x correctness. A percentage hides the two cells that matter most:
  // guessed-right (looks like mastery, isn't) and confidently-wrong (a
  // misconception you won't revisit because you think you know it).
  const quad={sc:0,su:0,wc:0,wu:0};
  ITEMS.forEach((q,idx)=>{
    if(result[idx]===null) return;
    const k=(result[idx]?'s':'w')+(conf[idx]==='sure'?'c':'u');
    quad[k]++;
  });
  const qrow=(label,n,note,flag)=>'<tr><td>'+label
    +(note?'<div style="font-size:11px;color:var(--muted)">'+note+'</div>':'')
    +'</td><td'+(flag&&n>0?' style="color:var(--bad);font-weight:700"':'')+'>'+n+'</td></tr>';
  const quadTable='<table class="brk">'
    +'<tr><td><strong>Confidence check</strong></td><td><strong>Items</strong></td></tr>'
    +qrow('Correct &amp; confident',quad.sc,'Solid.',false)
    +qrow('Correct but not sure',quad.su,'Guessed right — a score hides these.',true)
    +qrow('Wrong and not sure',quad.wu,'Known gaps — easiest to close.',false)
    +qrow('Wrong but confident',quad.wc,'Misconceptions — highest priority.',true)
    +'</table>';

  const missedNow=ITEMS.filter((q,idx)=>!result[idx]).length;
  const msg = pct>=85?'Strong — that is solid NCLEX readiness territory.'
            : pct>=70?'Passing range. Review the misses and the rationales.'
            : 'Keep grinding — focus on the missed items and re-run.';
  const timeLine = answered.length
    ? '<div class="endsub">'+fmt(totalSecs)+' total · '
      +Math.round(totalSecs/answered.length)+'s average per item</div>' : '';
  const slowLine = slowest.length>1
    ? '<div class="miss"><h3>Longest to answer</h3>'
      + slowest.map(x=>'<div>'+fmt(x.s)+' — '+x.q.topic+(result[x.idx]?'':' <span style="color:var(--bad)">(missed)</span>')+'</div>').join('')
      + '</div>' : '';
  app.innerHTML='<div class="card end">'
    +(ranOut?'<div class="verdict no" style="margin-bottom:8px">⏱ Time expired — submitted automatically</div>':'')
    +'<div class="score">'+pct+'%</div>'
    +'<div class="endsub">'+score+' of '+ITEMS.length+' correct</div>'
    +timeLine
    +'<p>'+msg+'</p>'
    +quadTable
    +slowLine
    +'<table class="brk"><tr><td><strong>Client Needs category</strong></td><td><strong>Correct</strong></td></tr>'+rows+'</table>'
    +(missedNow?'<div class="miss"><h3>'+missedNow+' missed this run — saved for a "Missed only" re-run.</h3></div>'
               :'<div class="miss"><h3>Perfect run — no misses.</h3></div>')
    +'<div class="actions" style="justify-content:center">'
    +'<button class="btn" id="restart">Back to start</button></div>'
    +'<div class="footnote">__FOOTNOTE__</div>'
    +'</div>';
  document.getElementById('restart').onclick=startScreen;
  fill.style.width='100%';
}

startScreen();
</script>
</body>
</html>
